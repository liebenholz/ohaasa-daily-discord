name: Annual Report

on:
  schedule:
    # 매년 12월 31일 KST 15:57 (UTC 06:57) — 실제 연도 말일 판정은 annual_stats.py가 수행
    - cron: '57 6 31 12 *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '집계 시작일 (YYYY-MM-DD) — 비워두면 자동(12/31 판정)'
        required: false
      end_date:
        description: '집계 종료일 (YYYY-MM-DD) — 비워두면 자동(12/31 판정)'
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run annual report (auto — 12/31 판정)
        if: github.event_name == 'schedule' || inputs.start_date == ''
        env:
          DISCORD_BOT_TOKEN:        ${{ secrets.DISCORD_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}
          TEST_GUILD_ID:   ${{ secrets.TEST_GUILD_ID }}
        run: python annual_stats.py

      - name: Run annual report (manual — 기간 지정)
        if: github.event_name == 'workflow_dispatch' && inputs.start_date != ''
        env:
          DISCORD_BOT_TOKEN:        ${{ secrets.DISCORD_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}
          TEST_GUILD_ID:   ${{ secrets.TEST_GUILD_ID }}
        run: python annual_stats.py "${{ inputs.start_date }}" "${{ inputs.end_date }}"
