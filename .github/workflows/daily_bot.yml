name: Ohaasa Daily Bot

on:
  schedule:
    # 다중 cron (방법 A) — 가장 먼저 잡히는 실행이 처리, 나머지는 가드로 즉시 종료
    - cron: '41 20 * * *'   # KST 05:40 (조기 시작 — 폴링이 갱신 대기)
    - cron: '01 21 * * *'   # KST 06:01 (예비 1)
    - cron: '21 21 * * *'   # KST 06:21 (예비 2)
    - cron: '41 21 * * *'   # KST 06:41 (예비 3)
    - cron: '01 22 * * *'   # KST 07:01 (예비 4)
  workflow_dispatch: # 수동으로 실행해볼 수 있는 버튼

concurrency:
  group: daily-bot
  cancel-in-progress: false   # 동시 실행 방지 — 앞선 실행 종료까지 대기

permissions:
  contents: write   # 자동 커밋&푸시에 필요

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 폴링 최대 1시간 + 여유
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: Run crawler & post to Discord
        env:
          # ⭐ 3단계: 웹훅 제거 — 주석 처리 (삭제 아님, 복원 가능)
          # DISCORD_WEBHOOK:      ${{ secrets.DISCORD_WEBHOOK }}
          TEST_DISCORD_WEBHOOK: ${{ secrets.TEST_DISCORD_WEBHOOK }}
          DEEPL_API_KEY:    ${{ secrets.DEEPL_API_KEY }}
          DISCORD_BOT_TOKEN:        ${{ secrets.DISCORD_BOT_TOKEN }}
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python main.py

      # ⭐ 이메일 테스트 리포트
      - name: Build email report
        if: always()
        run: python test/build_email_report.py
        continue-on-error: true

      - name: Get date for subject
        if: always()
        id: dt
        run: echo "today=$(TZ=Asia/Seoul date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[오하아사] 일일 테스트 리포트 ${{ steps.dt.outputs.today }}"
          to: ${{ secrets.MAIL_TO }}
          from: Ohaasa Bot <${{ secrets.MAIL_USERNAME }}>
          html_body: file://test/email_report.html
        continue-on-error: true

      - name: Commit & push horoscope JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update horoscope ($(TZ=Asia/Seoul date +'%Y-%m-%d'))"
            git push
          fi
          
      - name: Send preview to test channel
        if: success()
        env:
          TEST_DISCORD_WEBHOOK: ${{ secrets.TEST_DISCORD_WEBHOOK }}
        run: python tests/preview_webhook.py
        continue-on-error: true   # 프리뷰 실패해도 워크플로우는 성공 처리
